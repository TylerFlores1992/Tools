[project]
name = "vwmcp"
version = "0.2.0"
description = "MCP server that lets Claude draw in and measure Vectorworks drawings (Windows)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
]

[project.optional-dependencies]
# Needed only for the hotkey trigger on Windows.
windows = ["pywinauto>=0.6.8", "Pillow>=10"]
dev = ["pytest>=8"]

[project.scripts]
vwmcp = "vwmcp.server:main"
vwmcp-install-plugin = "vwmcp.install:main"
vwmcp-panel = "vwmcp.panel:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vwmcp"]

[tool.hatch.build.targets.wheel.force-include]
"vw_plugin" = "vwmcp/vw_plugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "vw_plugin", "dev"]
