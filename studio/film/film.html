<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#05070E;overflow:hidden}
.stage{position:relative;width:100vw;height:100vh;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse 60% 55% at 58% 42%,#1A2A4A 0%,#0B1428 45%,#04060D 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%}
#stars{z-index:0}#rays{z-index:1;mix-blend-mode:screen}#terrain{z-index:3}
.glow{position:absolute;left:60%;top:40%;width:62vw;height:60vh;transform:translate(-50%,-50%);z-index:1;background:radial-gradient(ellipse at center,rgba(255,170,110,.10),rgba(120,150,230,.10) 35%,transparent 65%)}
.wolf{position:absolute;left:60%;top:6vh;transform:translateX(-50%);z-index:2;opacity:.82;-webkit-mask-image:linear-gradient(180deg,#000 72%,transparent 100%)}
.wolf svg{width:min(66vh,1100px);height:auto;display:block;filter:drop-shadow(0 0 60px rgba(120,150,230,.25))}
@media (orientation: portrait){
  .wolf{left:50%;top:14vh}
  .wolf svg{width:84vw}
  .glow{left:50%;top:30%;width:120vw;height:50vh}
}
.haze{position:absolute;left:0;right:0;top:46%;height:22%;z-index:4;background:linear-gradient(180deg,transparent,rgba(24,40,70,.55) 45%,transparent)}
</style></head><body><div class="stage">
<canvas id="stars"></canvas><canvas id="rays"></canvas><div class="glow" id="glow"></div><div class="wolf" id="wolf"></div><canvas id="terrain"></canvas><div class="haze"></div></div>
<script src="terrain.js"></script><script src="wolf2.js"></script>
<script>
const q = new URLSearchParams(location.search);
const BASE_CAM = [0,700,-2500], BASE_LOOK = [0,200,3000];
const opts = { transparentSky:true, seed:0.13, focal:1.7, moon:[0.8,0.35,0.6], mistDrift:4.5,
  skyTop:'#0A1428', skyHor:'#1B2C48', fog:'#162540', moonCol:'#B4C4EA', rock:'#161B26', snow:'#CFDAF0', rim:'#7F9EE8', mist:1.25, exposure:1.6, bands:12 };
const rc = document.getElementById('rays'); rc.width = innerWidth; rc.height = innerHeight; const rg = rc.getContext('2d');
const wolfEl = document.getElementById('wolf');
document.getElementById('wolf').innerHTML = WOLF2.faceted({size:1100, dark:'#070D1A', light:'#566FA3', rim:'#9FB8FF', rimAmt:.35, edge:'rgba(200,220,255,.2)', eye:'#FFB27A', id:'fw'});
const eyes = document.querySelector('#wolf svg g[filter]');
const cv = document.getElementById('stars'); cv.width = innerWidth; cv.height = innerHeight; const g = cv.getContext('2d');
let sd = 11; const r = () => (sd = sd*16807 % 2147483647)/2147483647;
const STARS = Array.from({length: Math.round(innerWidth*innerHeight/1700)}, () => ({x:r()*innerWidth, y:Math.pow(r(),1.4)*innerHeight*.7, s:r()<.05?1.3:r()*.7+.2, a:.2+r()*.6, ph:r()}));
window.frame = async (phase) => {
  g.clearRect(0,0,cv.width,cv.height);
  for (const s of STARS) { g.globalAlpha = s.a*(0.6 + 0.4*Math.sin(6.2831853*(phase*2 + s.ph))); g.fillStyle = '#E8EEFF'; g.beginPath(); g.arc(s.x, s.y, s.s, 0, 7); g.fill(); }
  const TAU = 6.2831853, W = innerWidth, H = innerHeight;
  // shooting star: one streak per loop, phase 0.58-0.66
  const sp = (phase - 0.58) / 0.08;
  if (sp > 0 && sp < 1) {
    const x0 = W*0.18, y0 = H*0.10, x1 = W*0.46, y1 = H*0.30, hx = x0 + (x1-x0)*sp, hy = y0 + (y1-y0)*sp;
    const tail = 0.22, tx = x0 + (x1-x0)*Math.max(0, sp - tail), ty = y0 + (y1-y0)*Math.max(0, sp - tail);
    const gr = g.createLinearGradient(tx, ty, hx, hy); gr.addColorStop(0, 'rgba(232,238,255,0)'); gr.addColorStop(1, `rgba(232,238,255,${(Math.sin(Math.PI*sp)*0.9).toFixed(3)})`);
    g.globalAlpha = 1; g.strokeStyle = gr; g.lineWidth = 1.6; g.beginPath(); g.moveTo(tx, ty); g.lineTo(hx, hy); g.stroke();
  }
  // eyes: dark -> ignite -> hold -> dim, once per loop, with a hot core at the peak
  const e = Math.pow(0.5 + 0.5*Math.sin(TAU*phase - 1.5708), 1.6);
  eyes.style.opacity = (0.25 + 0.75*e).toFixed(3);
  eyes.style.filter = `url(#fwg) drop-shadow(0 0 ${(4 + 18*e).toFixed(1)}px rgba(255,178,122,${(0.35 + 0.6*e).toFixed(2)}))`;
  document.getElementById('glow').style.opacity = (0.55 + 0.45*e).toFixed(3);
  // moonbeams: soft wedges from behind the wolf, slowly swinging
  rg.clearRect(0, 0, W, H);
  const portrait = H > W, ox = W*(portrait ? 0.5 : 0.42), oy = -H*1.4;
  for (let k = 0; k < 7; k++) {
    const a = Math.PI/2 - 0.12 + (k - 3)*0.055 + 0.012*Math.sin(TAU*phase + k), wd = 0.012 + 0.008*Math.sin(k*1.7 + 1);
    const al = 0.035 + 0.025*Math.sin(TAU*phase + k*0.9);
    const len = H*2.6, gr = rg.createLinearGradient(ox, oy, ox + Math.cos(a)*len, oy + Math.sin(a)*len);
    gr.addColorStop(0.5, 'rgba(170,195,255,0)'); gr.addColorStop(0.62, `rgba(170,195,255,${al.toFixed(3)})`); gr.addColorStop(0.85, `rgba(150,180,240,${(al*0.6).toFixed(3)})`); gr.addColorStop(1, 'rgba(150,180,240,0)');
    rg.fillStyle = gr; rg.beginPath(); rg.moveTo(ox, oy);
    rg.lineTo(ox + Math.cos(a - wd)*len, oy + Math.sin(a - wd)*len); rg.lineTo(ox + Math.cos(a + wd)*len, oy + Math.sin(a + wd)*len); rg.closePath(); rg.fill();
  }
  // camera: a slow closed orbit (sideways sway + push in/out) so the ridges parallax and the loop closes
  const cx = 120*Math.sin(TAU*phase), cz = 190*Math.sin(TAU*phase - 1.5708), cy = 30*Math.sin(2*TAU*phase);
  const cam = [BASE_CAM[0] + cx, BASE_CAM[1] + cy, BASE_CAM[2] + cz], look = [BASE_LOOK[0] + cx*0.35, BASE_LOOK[1], BASE_LOOK[2]];
  // the wolf is far away: it drifts a little against the camera and grows slightly on the push-in
  const sc = 1 + 0.03*(cz/190);
  wolfEl.style.transform = `translateX(calc(-50% + ${(-cx*0.06).toFixed(2)}px)) translateY(${(-cy*0.1).toFixed(2)}px) scale(${sc.toFixed(4)})`;
  await renderTerrain(document.getElementById('terrain'), Object.assign({}, opts, { phase, cam, look }));
};
window.__ready = true;
</script></body></html>
